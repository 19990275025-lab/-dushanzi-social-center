<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>抖音采集器</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span>DOUYIN COLLECTOR · V1.0</span>
      <h1>抖音作品采集</h1>
      <p>只读取当前页面已经显示的数据，不读取 Cookie，不自动写入数据库。</p>
    </header>
    <main>
      <div class="status" id="status">请打开抖音创作者中心的作品管理页面。</div>
      <button id="collect" type="button">采集当前页面</button>
      <section id="result" hidden>
        <strong id="count">0 条作品</strong>
        <small>采集结果需上传至“智能采集中心”校验并人工确认。</small>
        <button class="secondary" id="download" type="button">导出标准 JSON</button>
      </section>
    </main>
    <footer>请遵守平台规则，仅采集有权管理的账号数据。</footer>
    <script src="popup.js"></script>
  </body>
</html>
